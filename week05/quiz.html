<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz | W05 Code Along Activity</title>
    <meta name="author" content="Vitor Soares Fernandes">
    <meta name="description" content="W05 Code Along Activity">
    <link rel="stylesheet" href="styles/quiz.css">
</head>

<body>
    <header class="box-spacing">
        <h1>✅ Basic HTML and CSS Quiz</h1>
    </header>

    <main>
        <form class="box-spacing">
            <div class="box-spacing">
                <label for="q1"><span class="question-number">1.</span>What HTML tag is used to
                    create a hyperlink?</label>
                <input type="text" id="q1" name="q1">
            </div>

            <div class="box-spacing">
                <label for="q2"><span class="question-number">2.</span>What is the purpose of CSS?
                    Explain in one or two
                    sentences.</label>
                <textarea name="q2" id="q2" rows="4"></textarea>
            </div>

            <div class="box-spacing">
                <label for="q3"><span class="question-number">3.</span>Which CSS property is used to
                    change the text
                    color?</label>
                <select name="q3" id="q3">
                    <option value="" selected disabled>Choose One...</option>
                    <option value="background-color">background-color</option>
                    <option value="font-size">font-size</option>
                    <option value="color">color</option>
                </select>
            </div>

            <div class="box-spacing">
                <label for="q4"><span class="question-number">4.</span>How many heading levels does
                    HTML have?</label>
                <input type="number" id="q4" name="q4">
            </div>

            <button type="submit" class="box-spacing">Submit Quiz</button>

        </form>
    </main>


</body>

</html>
